# 克制编辑简报：思源宋体阅读、黑体功能信息，按页面任务声明节奏。
book:
  title: 林间观察与现场笔记
  lang: zh
  style: editorial
  typography: bold
  purpose: guide
  duotone: 'off'
  folio: FIELD JOURNAL · 林间观察
  series:
    essays:
      label: 观察笔记
      items:
        '01': 把看见的写具体
        '02': 带着问题再回来
pages:
- layout: PAPER
  job: cover · 安静的刊物式封面
  body:
  - kicker: FIELD JOURNAL / 观察札记
  - title: '林间观察

      与现场笔记'
    size: 56
  - p: 先在一个熟悉的地方停下来。用位置、形状与关系写一段可以返回现场的记录，把还没有看清的部分，留作下一次的问题。
    flow: keep
  - figure: forest-wide.jpg
    h: 252
    caption: 林间光影，作为进入观察的情境图片。
  - cols:
    - - title: 看见
        size: 20
      - p: 从可以直接指认的细节开始，给观察留下具体的位置。
        flow: keep
    - - title: 记录
        size: 20
      - p: 用简图和短句保存关系，不把猜想写成已经确定的事实。
        flow: keep
    - - title: 再访
        size: 20
      - p: 带着上一次留下的问题回来，让两份记录可以互相比较。
        flow: keep
  rhythm: anchor
- layout: PAPER
  job: brief · 三栏短简报与整齐的中小图片
  body:
  - kicker: BULLETIN / 现场简报
  - title: 先看见，后解释
    size: 40
  - p: 简报从三个动作开始：定位、描述、提问。每一个动作都给之后的回访留下一条线索。
    flow: keep
  - cols:
    - - title: 定位
        size: 20
      - p: 先写下你站在哪里、朝哪个方向看，再描述对象与周围事物的关系。距离和方向能够帮助自己重新找到现场，也让同伴知道你的记录从哪里开始。
        flow: keep
    - - title: 描述
        size: 20
      - p: 挑选一个能够分辨对象的细节。颜色相近时看轮廓，轮廓相近时看大小与朝向。少用“特别”“漂亮”这样的评价，多写能够直接指认的形状。
        flow: keep
    - - title: 提问
        size: 20
      - p: 把解释放在观察旁边，用问号保留尚未确定的部分。问题可以很小，只要它能够告诉你下一次应该在哪里停留、再看一眼什么。
        flow: keep
  - cols:
    - - figure: forest-wide.jpg
        h: 196
        caption: 环境图片：先找到观察的位置。
    - - figure: forest-return.jpg
        h: 196
        caption: 水流情境：与林景并非同一地点。
  rhythm: dense
- layout: READING
  job: read · 连贯文章与完整段落首页
  series_header:
    series: essays
    item: '01'
  intro: 记录的第一步，是让另一个人读完，也能找到你看见的东西。
  notes:
  - 本页练习：位置、形状、差异。下一页再讨论解释。
  text:
  - 走进一片树林，最先进入眼睛的往往是整体：一条小路、一片绿色、几处亮光。这些印象能唤起记忆，却很难帮助别人找到某个具体对象。试着在熟悉的词后面多停一会儿。“一片叶子”在哪里？它靠近地面，还是挂在与你视线相齐的枝条上？把观察的位置写出来，文字就开始有了可以返回的坐标。
  - 接着描述一个可以指认的特征。与其写“叶子很特别”，不如沿着边缘看一圈，再把看到的起伏、缺口或卷曲写下来。这里的目标不是堆积形容词，而是选择最有辨识度的细节。如果两片叶子的颜色相近，就比较轮廓；如果轮廓也相近，就记录大小和朝向。每加一句，都想一想它是否真的帮助读者分辨。
  - 一张小图可以补充文字不擅长表达的关系。先画主体的大致轮廓，再用一两条线标出它与枝条、石头或路边的距离。图画不需要像照片一样完整，能够说明关系就有用。把画图时犹豫的位置留空，或者添一个问号；不要为了让页面显得完整，把没有看清的部分凭想象补齐。这样的空白也保存了观察的边界。
  rhythm: dense
- layout: READING
  job: read · 连贯文章与完整段落续页
  series_header:
    series: essays
    item: '01'
    continuation: true
  notes:
  - 用两种起句区分记录：“我看见……”与“我猜想……”。
  - 合上这一页前，圈出一个仍然需要证据的判断。
  text:
  - 写下“叶缘有一个缺口”，与写下“叶子被昆虫吃过”，并不是同一种记录。前一句描述眼前的形状，后一句解释形状可能怎样形成。解释让人兴奋，也容易比证据跑得更快。先把两种句子分开，再看看现场还有没有支持推测的线索。没有找到线索时，可以把解释保留为问题，让之后的观察有一个明确的方向。
  - 同伴的描述有时会让你发现自己忽略了什么。交换记录之前，先各自完成一小段，不急着统一答案。请对方只凭你的文字找到对象，再听听他在哪里停住、在哪里误解。找不到并不意味着观察失败，它可能提醒你补充位置，也可能说明某个词太笼统。把对方的问题记在旁边，修改那句真正影响理解的话。
  - 最后，回到对象旁边，把描述再读一遍。看看哪些句子仍能对应现场，哪些只是当时的印象。如果光线已经变化，就注明记录的条件，而不是把前后的差异悄悄抹掉。一份好的观察记录不需要表现得无所不知。它应当让人看清你见到了什么、怎样见到，以及哪些地方还没有确定；这些信息，会成为下一次观察真正可用的起点。
  rhythm: dense
- layout: PAPER
  job: observe · 中型图版与邻近说明
  body:
  - kicker: OBSERVATION / 图版
  - title: 一片叶子的线索
    size: 40
  - cols:
    - - figure: leaf-study.svg
        h: 392
        fit: contain
        caption: 原创结构示意，不用于物种鉴定。
    - - title: 轮廓
        size: 20
      - p: 沿边缘看一圈，记录直接看见的起伏。
        flow: keep
      - title: 纹路
        size: 20
      - p: 从中央向外，用简线标出纹路的方向。
        flow: keep
      - title: 连接
        size: 20
      - p: 看叶片与叶柄怎样相接，暂时保留解释。
        flow: keep
    widths: 2fr 1fr
  - p: 看完局部，再将目光放回整株植物。细节与环境之间的关系，同样值得记录。
    flow: keep
  rhythm: anchor
- layout: PAPER
  job: brief · 三栏回访方法
  body:
  - kicker: RETURN / 再读一次
  - title: 回来，再看一眼
    size: 40
  - p: 回访从上一份记录开始。先找到相近的位置，再决定什么值得比较。
    flow: keep
  - cols:
    - - title: 比较
        size: 20
      - p: 先挑一个问题，不必同时追踪所有细节。与其写“变多了”，不如留下可以比较的形状、位置或数量，并说明这次能够看清的范围。
        flow: keep
    - - title: 条件
        size: 20
      - p: 光线、距离和方向都可能影响看到的样子。把这些条件记在描述旁边，避免将所有差别都归结为对象本身发生了变化。
        flow: keep
    - - title: 边界
        size: 20
      - p: 没有发现明显变化，也是一条有价值的记录。注明观察的条件，保留判断的边界，不必为了显得有成果而夸大小差别。
        flow: keep
  - figure: forest-return.jpg
    h: 224
    caption: 流动情境图片，为下一次观察提出问题。
  rhythm: dense
- layout: PAPER
  job: act · 文字清单与稳定信息层级
  body:
  - kicker: CHECKLIST / 离开之前
  - title: 让记录经得起再读
    size: 40
  - p: 离开现场之前，读一遍自己的记录。检查以下几件事，把下一步变成一个可以执行的小动作。
    flow: keep
  - cards:
    - t: 位置清楚
      x: 同伴能否只凭文字与简图，找到你观察的位置？
    - t: 描述具体
      x: 有没有可以直接指出的形状、位置或差异？
    - t: 解释有边界
      x: 哪些是看见的事实，哪些仍然只是推测？
    - t: 下一步明确
      x: 再次回来时，你准备站在哪里，继续看什么？
    cols: 2
    style: line
  rhythm: dense
- layout: PAPER
  job: back · 安静地结束阅读
  body:
  - kicker: UNTIL NEXT TIME / 下次再来
  - title: 把问题留在现场
    size: 40
  - p: 一份记录不需要表现得无所不知。它只需要让人看清，你看见了什么、怎样看见，以及哪些地方还没有确定。
    flow: keep
  - p: 合上手册，带走一个有依据的问题。下一次，从它开始。
    flow: keep
  rhythm: breathing
