# All As AI 品牌包。色值、字体取自官网（alphaedu.si）的视觉规范；logo 目前是用 Comfortaa 生成的文字标占位，
# 拿到官网仓库里的 assets/brand/logo.svg（单色版）后直接覆盖本目录的 logo.svg。
name: All As AI
owner: Alpha International AI Edtech PTE LTD
site: www.alphaedu.si

# 默认 book 设置：book.yaml 里写了的优先（比如某本想换风格，只在 book.yaml 里写 style）
book:
  style: photo
  folio: All As AI
  color_mode: accent   # 点缀档：大面积白纸和浅紫，电光紫只做标题、数字、细线；深色星云留给封面和章节页（和官网一致）
  colors:              # 按角色写（palettes.py ROLES）：品牌色锁进对应角色
    preset: klein
    background: '#FFFFFF'        # 背景：白纸
    secondary_bg: '#F4F1FF'      # 次级背景：浅紫（官网浅色区块）
    primary: '#4B3BFF'           # 主色：电光靛蓝（标题、大数字、封面 / 章节页整块）
    accent: '#C6B8FF'            # 强调色：薰衣草紫（深底上的点缀）
    secondary_accent: '#7A2FE0'  # 次强调色：兰紫（官网渐变的另一端）
    body_text: '#1A1040'         # 正文：深墨
    MUT: '#4B4372'
  fonts:
    preset: sans
    title: [comfortaa, lxgw-neo-xihei, noto-sans-sc]
    accent: [comfortaa, lxgw-neo-xihei, noto-sans-sc]
    label: [comfortaa, lxgw-neo-xihei, noto-sans-sc]
    css: {title_w: 700, accent_w: 700, label_case: none, label_track: .12em}

logo:
  file: logo.svg      # 单色 SVG：排版时自动换成当页的字色（深底白、浅底靛蓝）
  mono: true          # 彩色 logo 写 false，并另给 dark: logo-white.svg 用在深底 / 照片上
  h: 24               # 在页面上的高度（px）；封面自动放大 1.5 倍
  pages: [cover, back]   # 自动放在封面、封底；其他页写 logo: true

# 封底自动加的联系方式（标记为装饰文字：原文核对不算 EXTRA，交付时列为“非原文元素”）
contact:
  - www.alphaedu.si
  - Alpha International AI Edtech PTE LTD · Singapore

# 品牌口吻（写方案、审稿时参考，不进排版）
voice: 可信、具体、不夸张；先说学校得到什么，再说技术。数字要有测试口径。
dont:
  - 不用“颠覆”“革命性”这类词
  - 不放未确认口径的对比数据
  - 学生照片不露正脸（除非有授权）
